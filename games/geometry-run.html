<!doctype html>
<html lang="en">
<head><script src="../gate.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Dash — Unblocker4school</title>
<style>
:root{color-scheme:dark;--cyan:#52f7ff;--pink:#ff4fe1;--bg:#070b1d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f7ff}body{display:flex;align-items:center;justify-content:center}.shell{width:min(1100px,100vw);padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 10px}.brand{font-weight:950;letter-spacing:.12em;font-size:clamp(15px,2.4vw,23px);text-shadow:0 0 18px #52f7ff66}.brand span{color:var(--cyan)}.stats{display:flex;gap:8px}.stat{min-width:78px;text-align:center;padding:7px 12px;border:1px solid #34446e;border-radius:10px;background:#101a35}.stat small{display:block;color:#9caed7;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.stat b{font-size:18px;font-variant-numeric:tabular-nums}.game{position:relative;border:1px solid #40538a;border-radius:16px;overflow:hidden;box-shadow:0 0 35px #192c654d, inset 0 0 30px #18295a;background:#0a1028}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:manipulation}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#05091dbd;padding:20px}.overlay.hidden{display:none}.panel{max-width:500px}.panel h1{font-size:clamp(28px,5vw,54px);line-height:1;margin:0 0 12px;font-weight:1000;letter-spacing:.04em;text-shadow:0 0 24px #52f7ff66}.panel p{color:#c0cbed;line-height:1.5;margin:0 auto 20px}.btn{appearance:none;border:0;border-radius:12px;padding:13px 25px;font-weight:900;font-size:16px;color:#061022;background:linear-gradient(120deg,var(--cyan),#8dffbe);box-shadow:0 5px 0 #218a9b,0 0 25px #52f7ff44;cursor:var(--cur-pointer,pointer)}.btn:active{transform:translateY(2px);box-shadow:0 3px 0 #218a9b}.hint{text-align:center;color:#8d9ec9;font-size:12px;margin:10px 0 0}.hint strong{color:#d8e4ff}.back{color:#aebce1;text-decoration:none;font-size:12px}.back:hover{color:white}@media(max-width:540px){.shell{padding:8px}.stat{min-width:59px;padding:5px 8px}.stat b{font-size:15px}.stat small{font-size:9px}.top{margin-bottom:7px}.hint{font-size:11px}}
/* round edges: default radius for boxes that had none (zero specificity, so any explicit radius still wins) */
:root{--round:10px}
:where(button,input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),select,textarea,img,video,canvas,iframe,dialog,details,summary,pre,kbd,progress,meter,fieldset,blockquote,aside,article,nav,header,footer,.card,.panel,.modal){border-radius:var(--round,10px)}
</style><link rel="stylesheet" href="../mobile.css"><link rel="stylesheet" href="../cursor.css"><script src="../cursor.js"></script></head>
<body><main class="shell"><header class="top"><div class="brand"><span>◆</span> NEON DASH</div><div class="stats"><div class="stat"><small>Distance</small><b id="score">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div></header><section class="game"><canvas id="game" width="960" height="540" aria-label="Infinite obstacle jumping game"></canvas><div class="overlay" id="overlay"><div class="panel"><h1 id="title">NEON DASH</h1><p id="message">Jump over the spikes and blocks. The run never ends — how far can you get?</p><button class="btn" id="start">START RUN</button></div></div></section><p class="hint"><strong>SPACE / ↑ / W / CLICK / TAP</strong> to jump · <a class="back" href="index.html">← Cartridge shelf</a></p></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message'),startBtn=document.getElementById('start'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');const W=960,H=540,ground=438;let running=false,dead=false,last=0,score=0,best=0,speed=340,spawnIn=.9,obstacles=[],particles=[],stars=[],distance=0,shake=0;const player={x:155,y:ground-34,w:34,h:34,vy:0,rot:0,onGround:true};try{best=+(localStorage.getItem('neon-dash-best')||0)}catch{}bestEl.textContent=best;for(let i=0;i<85;i++)stars.push({x:Math.random()*W,y:Math.random()*ground,r:Math.random()*1.8+.3,a:Math.random()*.55+.15});
function reset(){running=true;dead=false;score=0;distance=0;speed=340;spawnIn=.85;obstacles=[];particles=[];shake=0;player.y=ground-player.h;player.vy=0;player.rot=0;player.onGround=true;scoreEl.textContent='0';overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function jump(){if(!running){if(dead)reset();else reset();return}if(player.onGround){player.vy=-735;player.onGround=false;burst(player.x+player.w/2,player.y+player.h,9,'#52f7ff')}}function endRun(){running=false;dead=true;shake=10;burst(player.x+player.w/2,player.y+player.h/2,28,'#ff4fe1');if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neon-dash-best',best)}catch{}}title.textContent='CRASH!';message.textContent=`You made it ${score} meters. The course is infinite — give it another try!`;startBtn.textContent='RETRY';overlay.classList.remove('hidden')}
function burst(x,y,n,color){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=80+Math.random()*310;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.55,max:.9,size:2+Math.random()*5,color})}}
function spawn(){const r=Math.random();if(r<.58){obstacles.push({x:W+20,y:ground-34,w:34,h:34,type:'spike'})}else if(r<.78){obstacles.push({x:W+20,y:ground-48,w:42,h:48,type:'block'})}else{obstacles.push({x:W+20,y:ground-34,w:34,h:34,type:'spike'});obstacles.push({x:W+67,y:ground-34,w:34,h:34,type:'spike'})}spawnIn=Math.max(.58,1.12-Math.min(.42,(speed-340)/900))+Math.random()*.38}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();requestAnimationFrame(loop)}function update(dt){distance+=speed*dt;score=Math.floor(distance/22);scoreEl.textContent=score;speed=Math.min(650,340+score*1.15);spawnIn-=dt;if(spawnIn<=0)spawn();player.vy+=1900*dt;player.y+=player.vy*dt;if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.onGround=true;player.rot=Math.round(player.rot/(Math.PI/2))*(Math.PI/2)}else{player.onGround=false;player.rot+=dt*5.4}for(const o of obstacles)o.x-=speed*dt;obstacles=obstacles.filter(o=>o.x+o.w>-10);for(const o of obstacles){let hit=false;if(o.type==='spike'){const bx=o.x+7,by=o.y+9,bw=o.w-14,bh=o.h-9;hit=player.x+player.w-5>bx&&player.x+5<bx+bw&&player.y+player.h-4>by&&player.y+5<by+bh}else hit=player.x+player.w-4>o.x+3&&player.x+4<o.x+o.w-3&&player.y+player.h-3>o.y+3&&player.y+3<o.y+o.h-3;if(hit){endRun();draw();return}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-30*dt)}
function draw(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10183b');g.addColorStop(.58,'#0a1230');g.addColorStop(1,'#11152e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){let x=(s.x-distance*.06%(W+10)+W+10)%(W+10);ctx.globalAlpha=s.a;ctx.fillStyle='#bdeaff';ctx.fillRect(x,s.y,s.r,s.r)}ctx.globalAlpha=1;ctx.strokeStyle='#26396d';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<W;x+=42){ctx.moveTo(x,0);ctx.lineTo(x,ground)}for(let y=30;y<ground;y+=42){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();ctx.fillStyle='#101d42';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#52f7ff';ctx.shadowColor='#52f7ff';ctx.shadowBlur=18;ctx.fillRect(0,ground,W,3);ctx.shadowBlur=0;for(let x=-(distance*.8%48);x<W;x+=48){ctx.fillStyle='#223a66';ctx.fillRect(x,ground+18,24,3);ctx.fillRect(x+12,ground+33,12,3)}for(const o of obstacles){if(o.type==='spike'){ctx.save();ctx.shadowColor='#ff4fe1';ctx.shadowBlur=16;ctx.fillStyle='#ff4fe1';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffd4fa';ctx.lineWidth=2;ctx.stroke();ctx.restore()}else{ctx.save();ctx.shadowColor='#9c70ff';ctx.shadowBlur=17;ctx.fillStyle='#8b67ff';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.shadowBlur=0;ctx.strokeStyle='#d9ceff';ctx.lineWidth=2;ctx.strokeRect(o.x+3,o.y+3,o.w-6,o.h-6);ctx.fillStyle='#3d2e8a';ctx.fillRect(o.x+10,o.y+10,o.w-20,o.h-20);ctx.restore()}}ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);ctx.rotate(player.rot);ctx.shadowColor='#52f7ff';ctx.shadowBlur=24;ctx.fillStyle='#52f7ff';ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);ctx.shadowBlur=0;ctx.strokeStyle='#dfffff';ctx.lineWidth=3;ctx.strokeRect(-player.w/2+4,-player.h/2+4,player.w-8,player.h-8);ctx.fillStyle='#142550';ctx.fillRect(-8,-7,5,5);ctx.fillRect(4,-7,5,5);ctx.restore();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;ctx.restore()}
startBtn.addEventListener('click',reset);canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}if(e.code==='Enter'&&!running)reset()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;title.textContent='PAUSED';message.textContent='You left the tab. Start a new run when you are ready.';startBtn.textContent='RESUME RUN';overlay.classList.remove('hidden');startBtn.onclick=()=>{startBtn.onclick=reset;reset()}}});draw();})();
</script></body></html>
