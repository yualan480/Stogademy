        if (!overEl.classList.contains('hidden') || !settingsMenu.classList.contains('hidden')) return;
        startDrag(e.currentTarget, e, true);
      }

      function startDrag(src, e, sticky) {
        const index = Number(src.dataset.index);
        const p = pieces[index];
        if (!p) return;
        e.preventDefault();
        Sound.unlock();
        Sound.pick();

        const pitch = boardEl.getBoundingClientRect().width / SIZE;
        const ghost = buildPiece(p, 'ghost');
        ghost.style.setProperty('--s', pitch + 'px');
        document.body.appendChild(ghost);
        src.classList.add('dragging');

        drag = {
          index, p, ghost, pitch, src, sticky,
          // on touch screens, lift the piece above the finger so you can see it
          lift: e.pointerType === 'mouse' ? 0 : pitch * 1.6,
          target: null,
          lastKey: null
        };
        moveGhost(e);

        window.addEventListener('pointermove', onMove);
        if (sticky) {
          document.body.style.cursor = 'grabbing';
          window.addEventListener('pointerdown', onStickyDrop, true);   // the next click drops it
        } else {
          window.addEventListener('pointerup', onUp);
          window.addEventListener('pointercancel', onCancel);
        }
      }

      function onStickyDrop(e) {
        if (!drag) return;
        e.preventDefault();
        e.stopPropagation();                    // this click only drops the piece; it must not pick anything up
        if (e.button !== 0) { endDrag(); Sound.cancel(); return; }
        onUp();
      }

      function moveGhost(e) {
        const { p, ghost, pitch, lift } = drag;
        const left = e.clientX - (p.cols * pitch) / 2;
        const top = e.clientY - (p.rows * pitch) / 2 - lift;
        ghost.style.left = left + 'px';
        ghost.style.top = top + 'px';

        const rect = boardEl.getBoundingClientRect();
        const c = Math.round((left - rect.left) / pitch);
        const r = Math.round((top - rect.top) / pitch);
        drag.target = canPlace(p, r, c) ? { r, c } : null;
        const key = drag.target ? r + ',' + c : null;
        if (key && key !== drag.lastKey) Sound.tick();
        drag.lastKey = key;
        showPreview(p, drag.target);
      }

      function onMove(e) { if (drag) moveGhost(e); }

      function onUp() {
        if (!drag) return;
        const { index, target } = drag;
        endDrag();
        if (target) place(index, target.r, target.c);
        else Sound.cancel();
      }

      function onCancel() { endDrag(); }

      function endDrag() {
        if (!drag) return;
        drag.ghost.remove();
        drag.src.classList.remove('dragging');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onCancel);
        window.removeEventListener('pointerdown', onStickyDrop, true);
        document.body.style.cursor = '';
        hoverBlock = performance.now() + 300;
        drag = null;
        renderBoard();
      }

      /* ---------- placing and scoring ---------- */

      function place(index, r, c) {
        const p = pieces[index];
        p.cells.forEach(([dr, dc]) => { board[r + dr][c + dc] = p.color; });
        pieces[index] = null;

        score += p.cells.length;
        Sound.place();

        const { rows, cols } = findFullLines(board);
        const lines = rows.length + cols.length;

        renderBoard();
        renderTray();
        p.cells.forEach(([dr, dc]) => cellEls[(r + dr) * SIZE + c + dc].classList.add('land'));   // a little bounce as it lands

        if (lines === 0) {
          if (combo > 0) {
            misses += 1;
            if (misses >= 3) { combo = 0; misses = 0; lastCeleb = 0; }      // three tries with no clear: the combo ends
          }
          syncHeart();
          updateScore();
          afterMove();
          return;
        }

        combo += 1;
        misses = 0;
        const gained = 10 * lines * lines * combo;
        score += gained;
        const tier = Math.min(4, lines - 1 + (combo >= 5 ? 1 : 0));   // 0 Good!, 1 Great!, 2 Excellent!, 3 Amazing!, 4 Incredible!
        Sound.clear(lines, combo);
        if (tier >= 1) Sound.praise(Math.min(3, tier));
        updateScore();
        syncHeart();
        buzz(lines >= 3 ? [30, 40, 70] : 25);

        const toClear = new Set();
        rows.forEach(rr => { for (let cc = 0; cc < SIZE; cc++) toClear.add(rr * SIZE + cc); });
        cols.forEach(cc => { for (let rr = 0; rr < SIZE; rr++) toClear.add(rr * SIZE + cc); });
        const idx = [...toClear];

        // Is this a big one? Three lines at once, a wiped board, or a long combo earns the full celebration.
        let left = 0;
        for (let i = 0; i < SIZE * SIZE; i++) if (board[Math.floor(i / SIZE)][i % SIZE] !== null && !toClear.has(i)) left++;
        const perfect = left === 0;
        const big = perfect || lines >= 3 || (combo >= 5 && combo - lastCeleb >= 2);

        // read positions and colours now, before the cells empty
        const cellList = idx.map(i => {
          const rc = cellEls[i].getBoundingClientRect();
          return { x: rc.left + rc.width / 2, y: rc.top + rc.height / 2, k: COLORS[board[Math.floor(i / SIZE)][i % SIZE]] };
        });
        const cw = boardEl.getBoundingClientRect().width / SIZE;

        blast(rows, cols);
        emojiPops(p.cells.map(([dr, dc]) => (r + dr) * SIZE + c + dc).filter(i => toClear.has(i)), tier);
        idx.forEach(i => {
          cellEls[i].style.setProperty('--rot', ((Math.random() < 0.5 ? -1 : 1) * (3 + Math.random() * 6)).toFixed(1) + 'deg');
          cellEls[i].classList.add('clearing');
        });

        const mx = idx.reduce((t, i) => t + (i % SIZE), 0) / idx.length, my = idx.reduce((t, i) => t + Math.floor(i / SIZE), 0) / idx.length;
        if (!big) popup('+' + gained, 'gain', (mx + 0.5) / SIZE * 100, (my + 0.5) / SIZE * 100);
        if (lines >= 2) shake(1);

        const removeCells = () => {
          toClear.forEach(i => { board[Math.floor(i / SIZE)][i % SIZE] = null; });
          renderBoard();
        };

        locked = true;
        if (!big) {
          showToast(WORDS[tier], tier);
          if (combo >= 2) popup('Combo ' + combo, 'combo', 50, 64, 'f-blue');
          // the blocks wobble for a moment, then burst into shards
          clearTimer = setTimeout(() => {
            FX.pop(cellList, cw, combo);
            removeCells();
            locked = false;
            afterMove();
          }, 300);
        } else {
          lastCeleb = combo;
          const word = WORDS[tier];
          clearTimer = setTimeout(() => {
            applyTheme(themeIdx + 1);                       // the backdrop changes colour, like in the real game
            showBig(word, combo, gained, perfect);
            boardWrap.classList.add('celeb');
            Sound.fill();
            FX.celebrate({
              rect: (() => { const b = boardEl.getBoundingClientRect(); return { x: b.left, y: b.top, w: b.width, h: b.height }; })(),
              onBurst() { Sound.burst(); buzz([40, 30, 90]); shake(2); removeCells(); },
              onUnlock() { locked = false; afterMove(); },
              onEnd() { boardWrap.classList.remove('celeb'); }
            });
          }, 260);
        }
      }

      function afterMove() {
        if (pieces.every(p => p === null)) {
          pieces = newPieces();
          renderTray(true);
          Sound.deal();
        }
        if (!pieces.some(p => p && canFitAnywhere(p))) gameOver(); else saveGame();
      }

      // stop any effect that is still running (a new game, or carrying on a saved one)
      function stopEffects() {
        clearTimeout(clearTimer);
        FX.cancel();
        hideBig();
        boardWrap.classList.remove('celeb');
        lastCeleb = 0;
      }

      /* ---------- saved game: so a player can carry on later, or on another device ---------- */
      const SAVE_KEY = 'blockblast-save';
      function saveGame() {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify({ t: Date.now(), board, pieces, score, combo, misses, heartShown }));
        } catch (e) { /* storage unavailable */ }
      }
      function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }
      const isInt = (n, lo, hi) => Number.isInteger(n) && n >= lo && n <= hi;
      function validSave(sv) {
        if (!sv || !Array.isArray(sv.board) || sv.board.length !== SIZE || !Array.isArray(sv.pieces) || sv.pieces.length < 1 || sv.pieces.length > 6) return false;
        if (!sv.board.every(row => Array.isArray(row) && row.length === SIZE && row.every(v => v === null || isInt(v, 0, COLORS.length - 1)))) return false;
        if (!sv.pieces.every(p => p === null || (p && Array.isArray(p.cells) && p.cells.length >= 1 && p.cells.length <= 25 &&
          p.cells.every(c => Array.isArray(c) && c.length === 2 && isInt(c[0], 0, 4) && isInt(c[1], 0, 4)) &&
          isInt(p.rows, 1, 5) && isInt(p.cols, 1, 5) && isInt(p.color, 0, COLORS.length - 1)))) return false;
        return isInt(sv.score, 0, 10000000) && isInt(sv.combo, 0, 1000) && isInt(sv.misses, 0, 10);
      }
      // carry on from the saved game; false if there is none (or it can no longer be played)
      function resumeGame() {
        let sv = null;
        try { sv = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { sv = null; }
        if (!validSave(sv) || !sv.pieces.some(p => p)) { if (sv) clearSave(); return false; }
        endDrag();
        stopEffects();
        board = sv.board; pieces = sv.pieces; score = sv.score; combo = sv.combo; misses = sv.misses; heartShown = !!sv.heartShown;
        if (!pieces.some(p => p && canFitAnywhere(p))) { clearSave(); return false; }
        shown = 0;
        locked = false;
        overEl.classList.add('hidden');
        Sound.setLevel(1);
        renderBoard();
        renderTray(true);
        updateScore();
        syncHeart();
        return true;
      }

      function gameOver() {
        clearSave();
        if (window.Leaderboard) Leaderboard.submit('blockblast', score);
        finalScoreEl.textContent = score;
        finalBestEl.textContent = score >= best && score > 0 ? 'New best score!' : 'Best: ' + best;
        overEl.classList.remove('hidden');
        Sound.setLevel(0.3);
        Sound.gameOver(score >= best && score > 0);
      }

      function newGame() {
        bank();
        endDrag();
        stopEffects();
        clearSave();
        board = emptyBoard();
        score = 0;
        shown = 0;
        combo = 0;
        misses = 0;
        heartShown = false;
        locked = false;
        pieces = newPieces();
        overEl.classList.add('hidden');
        Sound.setLevel(1);
        Sound.click();
        renderBoard();
        renderTray(true);
        updateScore();
        syncHeart();
      }

      // a tap during the celebration jumps straight to the burst
      document.addEventListener('pointerdown', () => { if (FX.active()) FX.skip(); }, true);

      /* ---------- settings menu ---------- */
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsMenu = document.getElementById('settingsMenu');
      const themeBtn = document.getElementById('themeBtn');
      const musicToggle = document.getElementById('musicToggle');
      const sfxToggle = document.getElementById('sfxToggle');
      const vibToggle = document.getElementById('vibToggle');
      const autoToggle = document.getElementById('autoToggle');

      function closeSettings() {
        settingsMenu.classList.add('hidden');
        settingsBtn.setAttribute('aria-expanded', 'false');
      }
      function syncToggles() {
        [[musicToggle, Sound.musicOn], [sfxToggle, Sound.sfxOn], [vibToggle, vibOn], [autoToggle, autoHold]].forEach(([btn, on]) => {
          btn.setAttribute('aria-checked', String(on));
          btn.classList.toggle('off', !on);
          btn.querySelector('.state').textContent = on ? 'On' : 'Off';
        });
      }
      themeBtn.addEventListener('click', () => { applyTheme(themeIdx + 1); Sound.unlock(); Sound.click(); });
      settingsBtn.addEventListener('click', () => {
        const open = settingsMenu.classList.toggle('hidden') === false;
        settingsBtn.setAttribute('aria-expanded', String(open));
        Sound.unlock();
        Sound.click();
      });
      musicToggle.addEventListener('click', () => { Sound.setMusic(!Sound.musicOn); syncToggles(); });
      sfxToggle.addEventListener('click', () => { Sound.setSfx(!Sound.sfxOn); syncToggles(); Sound.click(); });
      vibToggle.addEventListener('click', () => {
        vibOn = !vibOn;
        try { localStorage.setItem('blockblast-vibrate', vibOn ? 'on' : 'off'); } catch (e) { /* ignore */ }
        syncToggles();
        buzz(40);
      });
      autoToggle.addEventListener('click', () => {
        autoHold = !autoHold;
        try { localStorage.setItem('blockblast-autohold', autoHold ? 'on' : 'off'); } catch (e) { /* ignore */ }
        if (!autoHold && drag && drag.sticky) { endDrag(); Sound.cancel(); }   // put back any piece being held
        syncToggles();
        Sound.click();
      });
      document.getElementById('settingsClose').addEventListener('click', closeSettings);
      document.addEventListener('pointerdown', e => {
        if (!settingsMenu.contains(e.target) && !settingsBtn.contains(e.target)) closeSettings();
      });
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if (drag && drag.sticky) { endDrag(); Sound.cancel(); }   // Esc puts a held piece back
        closeSettings();
      });
      syncToggles();

      document.getElementById('restart').addEventListener('click', () => { closeSettings(); newGame(); });
      document.getElementById('again').addEventListener('click', newGame);

      GamePause.init({ autoPause: false, playing: () => overEl.classList.contains('hidden'), onPause: () => { endDrag(); bank(); } });
      if (!resumeGame()) newGame();
    })();
  </script>
</body>
</html>
