<!DOCTYPE html>
<html lang="en">
<head><script src="../gate.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Getaway Shootout | Gamer4school</title>
  <meta name="description" content="Play Getaway Shootout in your browser: a chaotic ragdoll race to the parachute.">
  <meta name="theme-color" content="#0e2457">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
  <link rel="shortcut icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
  <style>
    :root { --pixel: "Pixelify Sans", "Courier New", monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0e2457; overflow: hidden; overscroll-behavior: none; }
    body {
      color: #fff;
      font-family: var(--pixel);
      -webkit-user-select: none; user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    :focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }

    /* the game fills the window; Unity sizes its canvas to this box */
    #game { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
    #game canvas { display: block; }


    /* only when the page is opened on its own (not inside the phone) */
    #home {
      position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; z-index: 10;
      padding: 0.35em 1em; border-radius: 99px; text-decoration: none; color: #fff;
      background: rgba(10, 6, 28, 0.6); border: 2px solid rgba(255, 255, 255, 0.45);
      font-weight: 600; font-size: 15px;
    }
    #home:hover { background: rgba(10, 6, 28, 0.85); }
    .embed #home { display: none; }
/* round edges: default radius for boxes that had none (zero specificity, so any explicit radius still wins) */
:root{--round:10px}
:where(button,input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),select,textarea,img,video,canvas,iframe,dialog,details,summary,pre,kbd,progress,meter,fieldset,blockquote,aside,article,nav,header,footer,.card,.panel,.modal){border-radius:var(--round,10px)}
</style>
<link rel="stylesheet" href="../mobile.css"><link rel="stylesheet" href="../cursor.css"><script src="../cursor.js"></script></head>
<body>
  <a id="home" href="index.html">&lsaquo; Home</a>

  <div id="game"></div>


  <!-- Install streaming capture support before Unity creates a WebGL context. -->
  <script src="leaderboard.js"></script>
  <script src="getaway-online.js?v=5"></script>
  <script>
    (function () {
      'use strict';
      if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embed');

      function fail(msg) { console.error('Getaway Shootout: ' + msg); }

      // This build was made for the Poki portal and may call its SDK. These do-nothing stand-ins keep it running with no ads or tracking.
      var noop = function () {};
      window.PokiSDK = {
        init: function () { return Promise.resolve(); },
        initWithVideoHB: function () { return Promise.resolve(); },
        commercialBreak: function () { return Promise.resolve(); },
        rewardedBreak: function () { return Promise.resolve(false); },
        isAdBlocked: function () { return false; },
        gameLoadingStart: noop, gameLoadingFinished: noop, gameLoadingProgress: noop,
        gameplayStart: noop, gameplayStop: noop, happyTime: noop,
        setDebug: noop, setLogging: noop, captureError: noop, customEvent: noop
      };

      // The Unity build calls window.initPokiBridge(objectName) at startup, then waits for a "ready" message.
      // This is the same bridge the original page provides, but wired to the stand-ins above (no ads, no Poki servers).
      window.initPokiBridge = function (name) {
        if (window.pokiReady || window.pokiAdBlock) {
          if (window.pokiReady) window.unityGame.SendMessage(name, 'ready');
          else window.unityGame.SendMessage(name, 'adblock');
        } else {
          window.pokiBridge = name;
        }
        window.commercialBreak = function () {
          window.PokiSDK.commercialBreak().then(function () {
            window.unityGame.SendMessage(name, 'commercialBreakCompleted');
          });
        };
        window.rewardedBreak = function () {
          window.PokiSDK.rewardedBreak().then(function (r) {
            window.unityGame.SendMessage(name, 'rewardedBreakCompleted', String(r));
          });
        };
      };
      // tell the bridge the (fake) SDK is ready, whether the game asks before or after this
      window.PokiSDK.init().then(function () {
        if (window.pokiBridge) window.unityGame.SendMessage(window.pokiBridge, 'ready');
        else window.pokiReady = true;
      });

      // keep the arrow keys and space for the game, not for scrolling the page
      window.addEventListener('keydown', function (e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) !== -1) e.preventDefault();
      }, { passive: false });
      // a click anywhere gives the game the keyboard
      window.addEventListener('pointerdown', function () { window.focus(); });

      function onProgress(instance, progress) {
        if (progress === 'complete' || Number(progress) >= 1) { try { window.focus(); } catch (e) { /* ignore */ } }
      }

      // UnityLoader.js can sit in a few places depending on how the build was packaged; try each in turn
      var LOADERS = ['Build/UnityLoader.js', 'UnityLoader.js', 'js/UnityLoader.js', 'js/v2/UnityLoader.js',
                     'Build/UnityLoader.2019.2.js', 'UnityLoader.2019.2.js', 'js/UnityLoader.2019.2.js', 'js/v2/UnityLoader.2019.2.js'];
      function tryLoader(i) {
        if (i >= LOADERS.length) {
          fail('Could not find UnityLoader.js (tried: ' + LOADERS.join(', ') + ').');
          return;
        }
        var s = document.createElement('script');
        s.src = LOADERS[i];
        s.onload = function () {
          if (typeof UnityLoader === 'undefined') { s.remove(); tryLoader(i + 1); return; }
          try {
            window.unityGame = window.gameInstance = UnityLoader.instantiate('game', 'Build/GetawayShootoutPoki.json', { onProgress: onProgress });
          } catch (err) {
            fail('The game started badly: ' + String(err && err.message || err));
          }
        };
        s.onerror = function () { s.remove(); tryLoader(i + 1); };
        document.body.appendChild(s);
      }
      tryLoader(0);
    })();
  </script>
</body>
</html>
