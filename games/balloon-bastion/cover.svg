<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Balloon Bastion</title>
  <desc id="desc">A glowing turret defending a winding starry trail from bright floating balloons.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07143d"/><stop offset=".55" stop-color="#125e86"/><stop offset="1" stop-color="#442c8d"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#72d7de"/><stop offset="1" stop-color="#245778"/></linearGradient>
    <radialGradient id="pink" cx=".25" cy=".2" r=".9"><stop stop-color="#fff"/><stop offset=".18" stop-color="#ffc0e9"/><stop offset="1" stop-color="#e94096"/></radialGradient>
