<!DOCTYPE html>
<html lang="en">
    <head><title>Guess the Pokémon (Stats)</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8">
        <script src="js/main.js" type="module"></script>
        <script src="bootstrap-5.0.2-dist/js/bootstrap.js"></script>
        <link rel="stylesheet" href="css/bars.css">
        <link rel="stylesheet" href="css/help.css">
        <link rel="stylesheet" href="css/autocomplete.css">
        <link rel="stylesheet" href="bootstrap-5.0.2-dist/css/bootstrap.css">
    <link rel="stylesheet" href="orbit.css"></head>
    <body>
        <div class="container"> 
            <h2>Guess the Pokémon (Stats)</h2>            
              <div class="row p-2">
                <div class="col-lg-6 col-12 js-bars-container">
        
                </div>
                <div class="col-12 col-lg-6 mt-2"> 
                    <div class="row"> 
                        <div class="col-6 align-items-center justif-content-center">
                            <button class="btn btn-primary js-show-values m-2" type="button">Show values</button>
                            <button class="btn btn-secondary js-show-help col-6 m-2" type="button">Hint</button>
                        </div>
                        <div class="col-6 help-container">                    
                            <div class="help-row">
                                <strong>Ability 1: </strong>
                                <span class="ability1"></span>
                            </div>
                            <div class="help-row">
                                <strong>Ability 2</strong>
                                <span class="ability2"></span>
                            </div>
                            <div class="help-row">
                                <strong>Hidden Ability: </strong>
                                <span class="hidden-ability"></span>
                            </div>
                            <div class="help-row">
                                <strong>Type 1: </strong>
                                <span class="type1"></span>
                            </div>
                            <div class="help-row">
                                <strong>Type 2: </strong>
                                <span class="type2"></span>
                            </div>
                        </div>
                    </div>
                </div> 
            </div>
            <div class="row">    
                    <div class="solve-riddle m-2">
                        <label for="solution">Enter a Pokémon name</label>
                        <div class="autocomplete">
                            <input type="text" id="solution" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go">
                            <div id="solution-choices" class="autocomplete-items"></div>
                        </div>
                        <span class="input-error d-none">!</span>
                        <button type="submit" class="btn btn-danger">Guess</button>
                    </div>
                </div>
            <h2 class="solution d-none"></h2>

            <button type="button" class="btn btn-warning m-3" id="giveUp">Reveal answer</button>
            <div class="filter-settings">
                <fieldset>
                    <legend>Filter by battle tier</legend>
                    <div class="tiers-select-area row">
                        <div class="col-4 tier-col-0"></div>
                        <div class="col-4 tier-col-1"></div>
                        <div class="col-4 tier-col-2"></div>
                    </div>
                    <button type="button" class="btn btn-light m-3" id="tiers-select-all">Select all</button>
                    <button type="button" class="btn btn-light m-3" id="tiers-select-none">Clear all</button>
                </fieldset>
            </div>
        </div>

<footer>Adapted from Pokémon Stat Quiz by Leoniebra. Pokémon © Nintendo / Game Freak / Creatures.</footer>
        <!-- Modal -->
        <div class="modal fade" id="reloadModal" tabindex="-1" data-bs-backdrop="static" aria-labelledby="exampleModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel"></h5>
              </div>
              <div class="modal-body row">
                <div class="modal-body-text col-md-9 col-12">
                </div> 
                <div class="modal-body-image col-md-3 col-12 d-flex justify-content-center">
                    <img src="">
                </div>                
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-primary reload" id="modalNew" data-bs-dismiss="modal">Next Pokémon</button>
              </div>
            </div>
          </div>
        </div>
        <audio class="js-pokemon-cry d-none" src=""></audio>
    </body>
</html>
