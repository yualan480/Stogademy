  <style>
    :root { --vh: 100vh; --pixel: "Pixelify Sans", "Courier New", monospace; --navy: #0a2540; --gold: #ffd166; --red: #e8452a; }

    .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }

    .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; background: rgba(7, 24, 43, 0.88); border-top: 2px solid #1f3a5c; }

    </main>

  <script src="leaderboard.js?v=20261102-payouts"></script>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const N = 10;
    const SHIPS = [
      { id: 'carrier', name: 'Carrier', len: 5 },
      { id: 'battleship', name: 'Battleship', len: 4 },
      { id: 'cruiser', name: 'Cruiser', len: 3 },
      { id: 'submarine', name: 'Submarine', len: 3 },
      { id: 'destroyer', name: 'Destroyer', len: 2 }
    ];
    const SHIP = {}; SHIPS.forEach(s => { SHIP[s.id] = s; });
    const rnd = n => Math.floor(Math.random() * n);
    const mk2d = () => Array.from({ length: N }, () => Array(N).fill(0));
    const store = {
      get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
    };
    const embed = new URLSearchParams(location.search).get('embed') === '1';
    if (embed) document.body.classList.add('embed');

    /* ================= sound: effects and music, all synthesized ================= */
    const Snd = (() => {
      let ac = null, master, sfxBus, musBus, noiseBuf, echo;
      let sfxOn = store.get('battleship-sfx', 'on') !== 'off';
      let musOn = store.get('battleship-music', 'on') !== 'off';
      let mode = 'calm', timer = 0, nextT = 0, step = 0, bar = 0;
      const BPM = 92, STEP = 60 / BPM / 4;
      const mf = m => 440 * Math.pow(2, (m - 69) / 12);

      function ensure() {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          try { ac = new AC(); } catch (e) { return null; }
          master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
          sfxBus = ac.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
          musBus = ac.createGain(); musBus.gain.value = musOn ? 0.5 : 0; musBus.connect(master);
          echo = ac.createDelay(1); echo.delayTime.value = 0.43;
          const fb = ac.createGain(); fb.gain.value = 0.38; echo.connect(fb); fb.connect(echo);
          const eg = ac.createGain(); eg.gain.value = 0.5; echo.connect(eg); eg.connect(musBus);
          noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
          const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });
        }
        if (ac.state === 'suspended' && !document.hidden) ac.resume();
        return ac;
      }
      function tone(f0, f1, dur, type, vol, when, bus, attack) {
        if (!ac) return;
        const t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(f0, t);
        if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.008));
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(bus || sfxBus);
        o.start(t); o.stop(t + dur + 0.05);
        return g;
      }
      function noise(dur, vol, type, f0, f1, when, bus) {
        if (!ac) return;
        const t = ac.currentTime + (when || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = noiseBuf; s.loop = true; f.type = type; f.Q.value = type === 'bandpass' ? 1.1 : 0.7;
        f.frequency.setValueAtTime(f0, t);
        if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(bus || sfxBus);
        s.start(t, Math.random()); s.stop(t + dur + 0.05);
      }
      const on = fn => (...a) => { if (sfxOn && ensure()) fn(...a); };
      const fx = {
        click: on(() => tone(660, 520, 0.05, 'square', 0.05)),
        rotate: on(() => { tone(500, 700, 0.06, 'square', 0.05); }),
        place: on(() => { noise(0.12, 0.25, 'lowpass', 900, 200); tone(180, 90, 0.12, 'sine', 0.25); }),
        found: on(() => { tone(660, 0, 0.12, 'triangle', 0.14); tone(990, 0, 0.25, 'triangle', 0.14, 0.12); }),
        fire: on(() => {
          noise(0.35, 0.5, 'lowpass', 2400, 120); tone(140, 38, 0.4, 'sine', 0.5);
          tone(1200, 380, 0.55, 'sine', 0.05, 0.1);            // the shell whistling in
        }),
        splash: on((w) => { noise(0.6, 0.3, 'bandpass', 2000, 380, w || 0); tone(300, 120, 0.2, 'sine', 0.1, w || 0); }),
        hit: on((w) => {
          noise(0.7, 0.55, 'lowpass', 3200, 140, w || 0); tone(130, 28, 0.55, 'sawtooth', 0.28, w || 0);
          noise(0.3, 0.2, 'highpass', 5000, 3000, (w || 0) + 0.05);
        }),
        sunk: on((w) => {
          [0, 0.18, 0.4].forEach(d => { noise(0.8, 0.5, 'lowpass', 3000, 100, (w || 0) + d); tone(110, 24, 0.7, 'sawtooth', 0.25, (w || 0) + d); });
          tone(440, 110, 1.1, 'triangle', 0.12, (w || 0) + 0.2);
        }),
        ping: on(() => tone(1500, 1490, 0.9, 'sine', 0.12, 0, null, 0.01)),
        win: on(() => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0, 0.28, 'square', 0.1, i * 0.14)); tone(1319, 0, 0.8, 'triangle', 0.12, 0.84); }),
        lose: on(() => { [392, 349, 311, 262].forEach((f, i) => tone(f, f * 0.97, 0.45, 'sawtooth', 0.09, i * 0.3)); tone(98, 70, 1.3, 'triangle', 0.2, 1.2); })
      };

      /* music: a slow naval theme in A minor. Calm for menus and placing ships, with a drum and arpeggio layer in battle. */
      const PROG = [[45, 0], [41, 1], [48, 1], [43, 1], [45, 0], [41, 1], [43, 1], [40, 1]];
      function pad(f, t, len) {
        const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
        o.type = 'triangle'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = 900;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 0.7); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.5);
        o.connect(lp); lp.connect(g); g.connect(musBus); o.start(t); o.stop(t + len + 0.6);
      }
      function playStep(s, b, t) {
        const root = PROG[b][0], maj = PROG[b][1], third = root + (maj ? 4 : 3), fifth = root + 7;
        const at = t - ac.currentTime;
        if (s === 0) {
          [root + 12, third + 12, fifth + 12].forEach(m => pad(mf(m), t, STEP * 16));
          if (mode === 'calm' && b % 4 === 0) tone(1760, 1750, 1.4, 'sine', 0.07, at + 0.15, echo, 0.01);   // sonar ping with echo
        }
        if (s === 0 || s === 6 || s === 10) tone(mf(root), 0, STEP * (s === 0 ? 5 : 3), 'triangle', 0.26, at, musBus, 0.01);
        if (s === 8) tone(mf(fifth), 0, STEP * 2, 'triangle', 0.22, at, musBus, 0.01);
        if (mode === 'battle') {
          if (s === 12) tone(mf(root + 12), 0, STEP * 2, 'triangle', 0.2, at, musBus, 0.01);
          if (s % 2 === 0) {
            const tones = [root + 24, third + 24, fifth + 24, third + 24];
            tone(mf(tones[((s / 2) + (b % 2)) % 4]), 0, 0.17, 'square', 0.035, at, musBus, 0.005);
          }
          if (s === 0 || s === 8) { tone(110, 40, 0.18, 'sine', 0.4, at, musBus); }
          if (s === 4 || s === 12) noise(0.13, 0.09, 'bandpass', 1800, 1200, at, musBus);
          if (s % 2 === 0) noise(0.04, s % 4 === 0 ? 0.045 : 0.025, 'highpass', 7000, 7000, at, musBus);
        } else if (s === 0 || s === 8) {
          tone(mf((b % 2 ? fifth : third) + 24), 0, 1.2, 'sine', 0.05, at, echo, 0.02);
        }
      }
      function sched() {
        if (!ac || !musOn || document.hidden) return;
        if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
        while (nextT < ac.currentTime + 0.35) {
          playStep(step, bar, nextT); nextT += STEP; step++;
          if (step === 16) { step = 0; bar = (bar + 1) % 8; }
        }
      }
      return {
        fx,
        get sfxOn() { return sfxOn; }, get musOn() { return musOn; },
        unlock() { if (ensure() && !timer) { nextT = 0; timer = setInterval(sched, 90); } },
        setMode(m) { mode = m; },
        setMusic(v) { musOn = v; store.set('battleship-music', v ? 'on' : 'off'); if (ensure()) { musBus.gain.setTargetAtTime(v ? 0.5 : 0, ac.currentTime, 0.08); Snd.unlock(); } },
        setSfx(v) { sfxOn = v; store.set('battleship-sfx', v ? 'on' : 'off'); }
      };
    })();

    /* ================= realtime: a tiny client for Supabase Realtime (Phoenix channels) ================= */
    const SB = (window.Leaderboard && window.Leaderboard.config) || null;
    class Chan {
      constructor(rt, name, key) { this.rt = rt; this.topic = 'realtime:' + name; this.key = key; this.h = {}; this.presence = {}; this.joined = false; this.onPresence = null; this.onClose = null; }
      on(ev, fn) { this.h[ev] = fn; return this; }
      join() {
        return new Promise((res, rej) => {
          const ref = this.rt.ref(); this.joinRef = ref;
          this._res = res; this._rej = rej;
          this.rt.send({ topic: this.topic, event: 'phx_join', ref, join_ref: ref,
            payload: { config: { broadcast: { ack: false, self: false }, presence: { key: this.key }, postgres_changes: [], private: false }, access_token: SB.key } });
          setTimeout(() => { if (!this.joined) rej(new Error('join timeout')); }, 8000);
        });
      }
      send(ev, payload) { this.rt.send({ topic: this.topic, event: 'broadcast', ref: this.rt.ref(), payload: { type: 'broadcast', event: ev, payload: payload || {} } }); }
      track(meta) { this.rt.send({ topic: this.topic, event: 'presence', ref: this.rt.ref(), payload: { type: 'presence', event: 'track', payload: meta } }); }
      leave() { this.rt.send({ topic: this.topic, event: 'phx_leave', payload: {}, ref: this.rt.ref() }); this.rt.chans.delete(this.topic); this.h = {}; this.onPresence = null; }
      _msg(m) {
        const p = m.payload || {};
        if (m.event === 'phx_reply') {
          if (m.ref === this.joinRef && !this.joined) {
            if (p.status === 'ok') { this.joined = true; this._res(); } else this._rej(new Error('join refused'));
          }
        } else if (m.event === 'broadcast') {
          if (p.event && this.h[p.event]) this.h[p.event](p.payload || {});
        } else if (m.event === 'presence_state') {
          this.presence = {};
          Object.keys(p).forEach(k => { this.presence[k] = (p[k].metas || []).slice(); });
          if (this.onPresence) this.onPresence();
        } else if (m.event === 'presence_diff') {
          const lv = p.leaves || {}, jn = p.joins || {};
          Object.keys(lv).forEach(k => {
            const refs = (lv[k].metas || []).map(x => x.phx_ref);
            this.presence[k] = (this.presence[k] || []).filter(x => refs.indexOf(x.phx_ref) === -1);
            if (!this.presence[k].length) delete this.presence[k];
          });
          Object.keys(jn).forEach(k => { this.presence[k] = (this.presence[k] || []).concat(jn[k].metas || []); });
          if (this.onPresence) this.onPresence();
        } else if (m.event === 'phx_error' || m.event === 'phx_close') {
          if (this.onClose) this.onClose();
        }
      }
    }
    class RT {
      constructor() { this.n = 0; this.chans = new Map(); this.ws = null; this.hb = 0; this.onClose = null; this.dead = false; }
      ref() { return String(++this.n); }
      connect() {
        return new Promise((res, rej) => {
          if (!SB) { rej(new Error('no config')); return; }
          let done = false;
          const url = SB.url.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(SB.key) + '&vsn=1.0.0';
          try { this.ws = new WebSocket(url); } catch (e) { rej(e); return; }
          const fail = e => { if (!done) { done = true; rej(e || new Error('closed')); } };
          setTimeout(() => fail(new Error('timeout')), 8000);
          this.ws.onopen = () => {
            done = true; res();
            this.hb = setInterval(() => this.send({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: this.ref() }), 20000);
          };
          this.ws.onerror = () => fail(new Error('error'));
          this.ws.onclose = () => { clearInterval(this.hb); fail(); if (!this.dead && this.onClose) this.onClose(); };
          this.ws.onmessage = ev => {
            let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
            const c = this.chans.get(m.topic); if (c) c._msg(m);
          };
        });
      }
      channel(name, key) { const c = new Chan(this, name, key); this.chans.set(c.topic, c); return c; }
      send(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); }
      close() { this.dead = true; clearInterval(this.hb); try { this.ws && this.ws.close(); } catch (e) { /* ignore */ } }
    }

    /* ================= fleet helpers ================= */
    const cellsOf = s => { const a = []; for (let i = 0; i < s.len; i++) a.push([s.x + (s.h ? i : 0), s.y + (s.h ? 0 : i)]); return a; };
    function fits(fleet, id, len, x, y, h) {
      if (x < 0 || y < 0 || x + (h ? len : 1) > N || y + (h ? 1 : len) > N) return false;
      for (const s of fleet) {
        if (s.id === id) continue;
        for (const c of cellsOf(s)) for (let i = 0; i < len; i++) if (c[0] === x + (h ? i : 0) && c[1] === y + (h ? 0 : i)) return false;
      }
      return true;
    }
    function randomFleet() {
      const f = [];
      SHIPS.forEach(sh => { for (;;) { const h = Math.random() < 0.5, x = rnd(N), y = rnd(N); if (fits(f, sh.id, sh.len, x, y, h)) { f.push({ id: sh.id, len: sh.len, x, y, h, hits: 0 }); break; } } });
      return f;
    }
    function shipAt(fleet, x, y) { return fleet.find(s => cellsOf(s).some(c => c[0] === x && c[1] === y)) || null; }
    // what a defender does when a shell lands: returns the answer to send back
    function takeShot(fleet, x, y) {
      const s = shipAt(fleet, x, y);
      if (!s) return { hit: false, sunk: null, win: false };
      s.hits++;
      const sunk = s.hits >= s.len ? { id: s.id, len: s.len, x: s.x, y: s.y, h: s.h } : null;
      return { hit: true, sunk, win: fleet.every(q => q.hits >= q.len) };
    }

    /* ================= the computer opponent: it behaves like a remote player ================= */
    class Bot {
      constructor(deliver) { this.deliver = deliver; this.reset(); }
      reset() {
        this.fleet = randomFleet(); this.shot = mk2d(); this.left = SHIPS.map(s => s.len); this.myTurn = false; this.timers = [];
      }
      later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
      stop() { this.timers.forEach(clearTimeout); this.timers = []; }
      receive(type, p) {
        if (type === 'ready') this.later(() => this.deliver('ready', {}), 500);
        else if (type === 'start') { this.myTurn = p.first === 'guest'; if (this.myTurn) this.schedule(); }
        else if (type === 'fire') {
          const r = takeShot(this.fleet, p.x, p.y);
          this.later(() => { this.deliver('result', { x: p.x, y: p.y, hit: r.hit, sunk: r.sunk, win: r.win }); if (!r.win) { this.myTurn = true; this.schedule(); } }, 450);
        } else if (type === 'result') {
          this.shot[this.last.y][this.last.x] = p.hit ? 2 : 1;
          if (p.sunk) { cellsOf(p.sunk).forEach(c => { this.shot[c[1]][c[0]] = 3; }); this.left.splice(this.left.indexOf(p.sunk.len), 1); }
          this.myTurn = false;
        } else if (type === 'rematch') { this.stop(); this.reset(); this.later(() => this.deliver('rematch', {}), 400); }
      }
      schedule() { this.later(() => { this.last = this.pick(); this.deliver('fire', this.last); }, 900 + Math.random() * 700); }
      // weigh every spot by how many of the remaining ships could still sit there; hits make nearby spots much heavier
      pick() {
        const w = mk2d(); let hitsOpen = 0;
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (this.shot[y][x] === 2) hitsOpen++;
        this.left.forEach(len => {
          for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) for (const h of [true, false]) {
            if (x + (h ? len : 1) > N || y + (h ? 1 : len) > N) continue;
            let ok = true, cover = 0;
            for (let i = 0; i < len; i++) { const v = this.shot[y + (h ? 0 : i)][x + (h ? i : 0)]; if (v === 1 || v === 3) { ok = false; break; } if (v === 2) cover++; }
            if (!ok) continue;
            for (let i = 0; i < len; i++) { const cy = y + (h ? 0 : i), cx = x + (h ? i : 0); if (this.shot[cy][cx] === 0) w[cy][cx] += 1 + cover * 30; }
          }
        });
        const free = []; let best = -1;
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (this.shot[y][x] === 0) { free.push({ x, y }); if (w[y][x] > best) best = w[y][x]; }
        if (!hitsOpen && Math.random() < 0.15) return free[rnd(free.length)];
        const top = free.filter(c => w[c.y][c.x] >= best * 0.9 && w[c.y][c.x] > 0);
        return (top.length ? top : free)[rnd((top.length ? top : free).length)];
      }
    }

    /* ================= game state ================= */
    const S = {
      phase: 'menu', mode: null, role: 'host',
      fleet: [], sel: 'carrier', horiz: true, hover: null,
      myReady: false, oppReady: false, started: false, turn: 'me',
      myShots: mk2d(), oppSunk: [], inShots: mk2d(), pending: null, aim: null,
      oppName: 'Opponent', oppAvatar: '', shotsMade: 0, shotsTaken: 0, rematchMe: false, rematchOpp: false, oppHere: false
    };
    let rt = null, lobby = null, room = null, bot = null, searchTimers = [];
    const myId = Math.random().toString(36).slice(2, 10);
    const myName = () => { const n = window.Leaderboard && Leaderboard.getName(); return n || 'Captain'; };
    const myAvatar = () => (window.Leaderboard ? Leaderboard.getAvatar() : '');
    let wins = parseInt(store.get('battleship-wins', '0'), 10) || 0, losses = parseInt(store.get('battleship-losses', '0'), 10) || 0;
    const showRecord = () => { $('wins').textContent = wins; $('losses').textContent = losses; };
    showRecord();

    /* ---------- screens ---------- */
    const panels = ['pMenu', 'pFriend', 'pSearch', 'pOver', 'pInfo'];
    function showPanel(id) {
      $('ov').hidden = !id;
      panels.forEach(p => { $(p).hidden = p !== id; });
    }
    function setStatus(txt, tone) { const s = $('status'); s.textContent = txt; s.className = 'status' + (tone ? ' ' + tone : ''); }
    function setAvatar(box, avatar) {
      const old = box.querySelector('.av'); if (old) old.remove();
      let el = null;
      try { if (window.Leaderboard && avatar && Leaderboard.isValidAvatar(avatar)) el = Leaderboard.avatarEl(avatar, 28); } catch (e) { el = null; }
      if (!el) { el = document.createElement('span'); el.className = 'av'; }
      box.insertBefore(el, box.firstChild);
    }
    function setPlayers() {
      $('nameMe').textContent = myName(); $('nameOpp').textContent = S.oppName;
      setAvatar($('pcMe'), myAvatar()); setAvatar($('pcOpp'), S.oppAvatar);
    }
    function updateTurnMarks() {
      $('pcMe').classList.toggle('turn', S.phase === 'battle' && S.turn === 'me');
      $('pcOpp').classList.toggle('turn', S.phase === 'battle' && S.turn === 'opp');
    }
    function inGameUi(on) { $('hud').hidden = !on; $('menuBtn').hidden = !on; }

    function toMenu() {
      closeNet(true);
      Object.assign(S, { phase: 'menu', mode: null, started: false, myReady: false, oppReady: false, oppHere: false });
      inGameUi(false); $('dock').hidden = true;
      Snd.setMode('calm');
      showPanel('pMenu');
    }
    function closeNet(sayBye) {
      searchTimers.forEach(clearInterval); searchTimers = [];
      if (bot) { bot.stop(); bot = null; }
      if (room) { if (sayBye) room.send('bye', {}); room.leave(); room = null; }
      if (lobby) { lobby.leave(); lobby = null; }
      if (rt) { rt.close(); rt = null; }
    }
    function info(title, text, opts) {
      $('iTitle').textContent = title; $('iText').textContent = text;
      $('bInfoAi').hidden = !(opts && opts.ai);
      showPanel('pInfo');
    }

    /* ---------- placement ---------- */
    function beginPlacement() {
      S.phase = 'place'; S.fleet = []; S.sel = 'carrier'; S.horiz = true; S.hover = null;
      S.myReady = false; S.oppReady = S.oppReady && false; S.started = false;
      S.myShots = mk2d(); S.inShots = mk2d(); S.oppSunk = []; S.pending = null; S.aim = null; S.shotsMade = 0; S.shotsTaken = 0;
      S.rematchMe = false; S.rematchOpp = false;
      inGameUi(true); setPlayers(); updateTurnMarks();
      showPanel(null); $('dock').hidden = false;
      Snd.setMode('calm');
      setStatus('Place your ships');
      buildDock();
    }
    function buildDock() {
      const box = $('shipBtns'); box.innerHTML = '';
      SHIPS.forEach(sh => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'ship' + (S.sel === sh.id ? ' sel' : '') + (S.fleet.some(f => f.id === sh.id) ? ' done' : '');
        const pips = document.createElement('i'); for (let i = 0; i < sh.len; i++) pips.appendChild(document.createElement('b'));
        const t = document.createElement('span'); t.textContent = sh.name;
        b.appendChild(pips); b.appendChild(t);
        b.addEventListener('click', () => { if (S.myReady) return; S.sel = sh.id; Snd.fx.click(); const placed = S.fleet.find(f => f.id === sh.id); if (placed) { S.horiz = placed.h; S.fleet = S.fleet.filter(f => f !== placed); } buildDock(); });
        box.appendChild(b);
      });
      const done = S.fleet.length === SHIPS.length;
      $('readyBtn').disabled = !done || S.myReady;
      ['rotBtn', 'rndBtn', 'clrBtn'].forEach(i => { $(i).disabled = S.myReady; });
      $('readyBtn').textContent = S.myReady ? 'Waiting...' : 'Ready!';
    }
    function nextUnplaced() { const u = SHIPS.find(s => !S.fleet.some(f => f.id === s.id)); S.sel = u ? u.id : null; }
    function placeAt(x, y) {
      if (S.myReady) return;
      const hit = shipAt(S.fleet, x, y);
      if (hit && !S.sel) {                     // pick a placed ship back up
        S.fleet = S.fleet.filter(f => f !== hit); S.sel = hit.id; S.horiz = hit.h; Snd.fx.click(); buildDock(); return;
      }
      if (!S.sel) return;
      const sh = SHIP[S.sel];
      if (hit && hit.id !== S.sel && !fits(S.fleet, sh.id, sh.len, x, y, S.horiz)) { S.fleet = S.fleet.filter(f => f !== hit); S.sel = hit.id; S.horiz = hit.h; Snd.fx.click(); buildDock(); return; }
      if (!fits(S.fleet, sh.id, sh.len, x, y, S.horiz)) { Snd.fx.rotate(); return; }
      S.fleet = S.fleet.filter(f => f.id !== sh.id); S.fleet.push({ id: sh.id, len: sh.len, x, y, h: S.horiz, hits: 0 });
      Snd.fx.place(); nextUnplaced(); buildDock();
    }
    function rotate() { if (S.myReady) return; S.horiz = !S.horiz; Snd.fx.rotate(); }
    $('rotBtn').addEventListener('click', rotate);
    $('rndBtn').addEventListener('click', () => { if (S.myReady) return; S.fleet = randomFleet(); S.sel = null; Snd.fx.place(); buildDock(); });
    $('clrBtn').addEventListener('click', () => { if (S.myReady) return; S.fleet = []; S.sel = 'carrier'; Snd.fx.click(); buildDock(); });
    $('readyBtn').addEventListener('click', () => {
      if (S.fleet.length !== SHIPS.length || S.myReady) return;
      S.myReady = true; Snd.fx.click(); buildDock();
      setStatus(S.oppReady ? 'Starting...' : 'Waiting for the opponent...');
      tx('ready', {}); maybeStart();
    });

    /* ---------- messages between the two players (same for the computer and for a person online) ---------- */
    function tx(type, p) {
      if (S.mode === 'ai') { if (bot) bot.receive(type, p || {}); }
      else if (room) room.send(type, p || {});
    }
    function onMsg(type, p) {
      if (S.phase === 'menu') return;
      if (type === 'ready') { S.oppReady = true; if (S.phase === 'place' && S.myReady) setStatus('Starting...'); maybeStart(); }
      else if (type === 'start') { if (S.phase === 'place' && S.myReady && !S.started) beginBattle(p.first === S.role ? 'me' : 'opp'); }
      else if (type === 'fire') handleFire(p);
      else if (type === 'result') handleResult(p);
      else if (type === 'rematch') { S.rematchOpp = true; checkRematch(); }
      else if (type === 'bye') oppLeft();
    }
    function maybeStart() {
      if (S.role === 'host' && S.myReady && S.oppReady && !S.started && S.phase === 'place') {
        const first = Math.random() < 0.5 ? 'host' : 'guest';
        tx('start', { first });
        beginBattle(first === S.role ? 'me' : 'opp');
      }
    }
    function beginBattle(turn) {
      S.started = true; S.phase = 'battle'; S.turn = turn; S.pending = null; S.aim = null;
      $('dock').hidden = true; Snd.setMode('battle'); Snd.fx.found();
      updateTurnMarks(); turnStatus();
    }
    function turnStatus() {
      if (S.phase !== 'battle') return;
      if (S.turn === 'me') setStatus('Your turn: fire!', 'good'); else setStatus(S.oppName + ' is aiming...', '');
      updateTurnMarks();
    }

    /* ---------- shooting ---------- */
    function fireAt(x, y) {
      if (S.phase !== 'battle' || S.turn !== 'me' || S.pending || S.myShots[y][x]) return;
      S.pending = { x, y }; S.aim = null; S.shotsMade++;
      Snd.fx.fire(); setStatus('Incoming...');
      tx('fire', { x, y });
    }
    function handleFire(p) {
      if (S.phase !== 'battle' || S.turn !== 'opp') return;
      const x = p.x | 0, y = p.y | 0;
      if (x < 0 || y < 0 || x >= N || y >= N || S.inShots[y][x]) return;
      const r = takeShot(S.fleet, x, y);
      S.inShots[y][x] = r.hit ? 2 : 1; S.shotsTaken++;
      tx('result', { x, y, hit: r.hit, sunk: r.sunk, win: r.win });
      impact('mine', x, y, r.hit, !!r.sunk);
      if (r.win) { finish(false); return; }
      S.turn = 'me'; turnStatus();
      if (S.mode === 'online') Snd.fx.ping();
    }
    function handleResult(p) {
      const q = S.pending; if (S.phase !== 'battle' || !q || q.x !== p.x || q.y !== p.y) return;
      S.pending = null;
      S.myShots[q.y][q.x] = p.hit ? 2 : 1;
      if (p.sunk) { S.oppSunk.push(p.sunk); cellsOf(p.sunk).forEach(c => { S.myShots[c[1]][c[0]] = 3; }); }
      impact('enemy', q.x, q.y, p.hit, !!p.sunk);
      if (p.win) { finish(true); return; }
      S.turn = 'opp'; turnStatus();
    }
    function finish(won) {
      S.phase = 'over'; updateTurnMarks();
      if (won) { wins++; store.set('battleship-wins', String(wins)); } else { losses++; store.set('battleship-losses', String(losses)); }
      showRecord();
      setStatus(won ? 'Victory!' : 'Defeat', won ? 'good' : 'bad');
      setTimeout(() => {
        if (S.phase !== 'over') return;
        Snd.setMode('calm'); (won ? Snd.fx.win : Snd.fx.lose)();
        $('oTitle').textContent = won ? 'Victory!' : 'Defeat'; $('oTitle').className = won ? 'win' : 'lose';
        $('oText').textContent = won ? 'You sank the whole enemy fleet in ' + S.shotsMade + ' shots.' : S.oppName + ' sank your fleet. You took ' + S.shotsTaken + ' shots.';
        $('bAgain').disabled = false; $('bAgain').textContent = 'Rematch'; $('oFine').textContent = '';
        showPanel('pOver');
      }, 1400);
    }
    function checkRematch() {
      if (S.phase !== 'over') return;
      if (S.rematchOpp && !S.rematchMe) $('oFine').textContent = S.oppName + ' wants a rematch!';
      if (S.rematchMe && S.rematchOpp) { S.oppReady = false; beginPlacement(); S.oppReady = false; }
    }
    $('bAgain').addEventListener('click', () => {
      Snd.fx.click(); S.rematchMe = true; $('bAgain').disabled = true; $('bAgain').textContent = 'Waiting...';
      tx('rematch', {}); checkRematch();
    });
    $('bMenu').addEventListener('click', () => { Snd.fx.click(); toMenu(); });
    function oppLeft() {
      if (S.phase === 'menu') return;
      const was = S.phase;
      closeNet(false); S.phase = 'menu'; inGameUi(false); $('dock').hidden = true; Snd.setMode('calm');
      info('Opponent left', was === 'battle' ? 'Your opponent left the game, so the battle is over.' : was === 'over' ? 'Your opponent left, so there will be no rematch.' : 'Your opponent left before the game started.');
    }

    /* ---------- the computer ---------- */
    function startAi() {
      closeNet(false);
      S.mode = 'ai'; S.role = 'host'; S.oppName = 'Admiral Bot'; S.oppAvatar = 'robot'; S.oppReady = false;
      bot = new Bot((t, p) => setTimeout(() => onMsg(t, p), 0));
      beginPlacement();
    }

    /* ---------- online: random opponent ---------- */
    function connectFail(err) {
      closeNet(false); S.phase = 'menu';
      info('Could not connect', 'The matchmaking server could not be reached. Your network may be blocking it. You can still play the computer.', { ai: true });
    }
    async function findOpponent() {
      closeNet(false);
      S.mode = 'online'; S.phase = 'search';
      $('sTitle').textContent = 'Searching...'; $('sCode').hidden = true; $('sText').textContent = 'Connecting...';
      showPanel('pSearch');
      rt = new RT();
      try { await rt.connect(); } catch (e) { connectFail(e); return; }
      rt.onClose = () => { if (S.phase === 'search') connectFail(); else if (S.mode === 'online' && S.phase !== 'menu' && S.phase !== 'over') { closeNet(false); S.phase = 'menu'; inGameUi(false); $('dock').hidden = true; info('Connection lost', 'The connection to the server dropped.'); } };
      lobby = rt.channel('battleship-lobby', myId);
      let searching = true, attempt = 0, lastInviteAt = 0;
      const invited = new Set();                       // every room this player has offered, so any accept can be recognised
      const waiting = () => {
        const out = [];
        Object.keys(lobby.presence).forEach(k => { const m = lobby.presence[k][lobby.presence[k].length - 1]; if (m && m.state === 'waiting') out.push(m); });
        return out.sort((a, b) => (a.ts - b.ts) || (a.id < b.id ? -1 : 1));
      };
      const tick = () => {
        if (!searching) return;
        const list = waiting();
        $('sText').textContent = list.length > 1 ? 'Found ' + (list.length - 1) + ' other sailor' + (list.length > 2 ? 's' : '') + '. Pairing up...' : 'Waiting for another player to search too. Tell a friend to press "Find an opponent"!';
        if (list.length > 1 && list[0].id === myId && Date.now() - lastInviteAt > 2500) {
          const target = list[1 + (attempt % (list.length - 1))];
          const roomId = Math.random().toString(36).slice(2, 10); attempt++; lastInviteAt = Date.now(); invited.add(roomId);
          lobby.send('invite', { from: myId, to: target.id, room: roomId });
        }
      };
      lobby.on('invite', p => {
        if (!searching || p.to !== myId || !p.room || typeof p.room !== 'string') return;
        searching = false;
        lobby.track({ id: myId, ts: Date.now(), state: 'matched' });
        lobby.send('accept', { to: p.from, from: myId, room: p.room });
        enterRoom('battleship-room-' + p.room, 'guest');
      });
      lobby.on('accept', p => {
        if (!searching || p.to !== myId || !invited.has(p.room)) return;
        searching = false; enterRoom('battleship-room-' + p.room, 'host');
      });
      lobby.onPresence = tick;
      try { await lobby.join(); } catch (e) { connectFail(e); return; }
      lobby.track({ id: myId, name: myName(), ts: Date.now(), state: 'waiting' });
      $('sText').textContent = 'Waiting for another player to search too. Tell a friend to press "Find an opponent"!';
      searchTimers.push(setInterval(tick, 3000));
    }

    /* ---------- online: a room, for a random match or a friend's code ---------- */
    async function enterRoom(channelName, role, opts) {

      try { await room.join(); } catch (e) { connectFail(e); return; }
      room.track({ id: myId, name: myName(), avatar: myAvatar(), role, ts: Date.now() });
      if (!opts.friend) {

            const r = f.r0 + (f.r1 - f.r0) * k;
            if (f.fill) { ctx.fillStyle = 'rgba(' + f.col + ',' + (0.75 * (1 - k)) + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill(); }
            else { ctx.strokeStyle = 'rgba(' + f.col + ',' + (0.8 * (1 - k)) + ')'; ctx.lineWidth = Math.max(1.5, L.cs * 0.07); ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.stroke(); }
          } else {
            const x = f.x + f.vx * tt, y = f.y + f.vy * tt + 0.5 * f.g * tt * tt, sz = f.size * (f.grow ? 1 + k * 1.5 : 1 - k * 0.5);
            ctx.fillStyle = 'rgba(' + f.col + ',' + (f.grow ? 0.45 * (1 - k) : 1 - k) + ')'; ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
          }
        }
        if (shake > 0) ctx.restore();
      }
      requestAnimationFrame(frame);
    }

    /* ================= input ================= */
    function canvasPoint(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    cv.addEventListener('pointermove', e => {
      if (!L) return;
      const [px, py] = canvasPoint(e);
      if (S.phase === 'place') S.hover = pickCell(L.mine, px, py);
      else if (S.phase === 'battle') { const c = pickCell(L.enemy, px, py); S.hover = c ? { x: c.x, y: c.y, enemy: true } : null; }
    });
    cv.addEventListener('pointerleave', () => { S.hover = null; });
    cv.addEventListener('pointerdown', e => {
      Snd.unlock();
      if (!L) return;
      const [px, py] = canvasPoint(e);
      if (S.phase === 'place') {
        const c = pickCell(L.mine, px, py); if (!c) return;
        S.hover = c;
        if (e.button === 2) { rotate(); return; }
        placeAt(c.x, c.y);
      } else if (S.phase === 'battle') {
        const c = pickCell(L.enemy, px, py); if (!c || S.turn !== 'me' || S.pending || S.myShots[c.y][c.x]) return;
        if (e.pointerType === 'touch' || e.pointerType === 'pen') {          // touch: tap once to aim, tap again to fire
          if (S.aim && S.aim.x === c.x && S.aim.y === c.y) fireAt(c.x, c.y); else { S.aim = c; Snd.fx.click(); setStatus('Tap again to fire', 'good'); }
        } else fireAt(c.x, c.y);
      }
    });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if ((e.key === 'r' || e.key === 'R') && S.phase === 'place') { e.preventDefault(); rotate(); }
      else if (e.key === 'Enter' && S.phase === 'place' && !$('readyBtn').disabled) { e.preventDefault(); $('readyBtn').click(); }
    });

    resize();
    showPanel('pMenu');
    requestAnimationFrame(frame);
    // expose a few things for testing in the console
    window.__bs = { S, onMsg, fireAt };
  })();
  </script>
</body>
