<!DOCTYPE html>
<html lang="en">
<head><script src="../gate.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Minesweeper | Gamer4school</title>
  <meta name="description" content="Play Minesweeper in your browser. Clear the board without hitting a mine. Easy, Medium and Hard.">
  <meta name="theme-color" content="#4a752c">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
  <link rel="shortcut icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <style>
    :root {
      --vh: 100vh;
      --bar: #4a752c;
    }
    @supports (height: 100dvh) { :root { --vh: 100dvh; } }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: var(--vh);
      overflow: hidden;
      overscroll-behavior: none;
      background: #578a34;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    :focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }

    .app {
      height: var(--vh);
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    /* ---------- top bar ---------- */
    .bar {
      flex: none;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: var(--bar);
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 3.4em;
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .stat svg { width: 26px; height: 26px; flex: none; }
    .tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .tools button, .tools select, .back {
      padding: 8px 10px;
      border: 0;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      font: 700 0.95rem system-ui, sans-serif;
      cursor:var(--cur-pointer,pointer);
    }
    .tools select { padding-right: 4px; }
    .tools select option { color: #222; }
    .tools button:hover, .tools select:hover, .back:hover { background: rgba(0, 0, 0, 0.34); }
    .tools button[aria-pressed="true"].mode { background: #e7471d; }
    #sfxBtn[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
    .back { text-decoration: none; }
    @media (max-width: 520px) {
      .bar { flex-wrap: wrap; row-gap: 6px; height: auto; min-height: 56px; padding: 6px 10px; }
      .tools { gap: 5px; }
      .tools button, .tools select, .back { padding: 8px; font-size: 0.85rem; }
      .stat { min-width: 0; font-size: 1.1rem; }
    }

    /* ---------- board ---------- */
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .board { position: relative; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); }
    canvas { display: block; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 1rem;
      text-align: center;
      background: rgba(30, 60, 15, 0.62);
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: clamp(1.5rem, 7vmin, 2.6rem); line-height: 1.1; }
    .overlay p { font-size: clamp(0.85rem, 3vmin, 1.1rem); max-width: 30ch; }
    .play {
      margin-top: 0.4rem;
      border: 0;
      border-radius: 4px;
      padding: 0.7rem 1.6rem;
      background: #4674e9;
      color: #fff;
      font: 700 clamp(1rem, 3.4vmin, 1.25rem) system-ui, sans-serif;
      cursor:var(--cur-pointer,pointer);
      box-shadow: 0 3px 0 #2c4cae;
    }
    .play:hover { background: #5a86f5; }
    .play:active { transform: translateY(2px); box-shadow: 0 1px 0 #2c4cae; }
/* round edges: default radius for boxes that had none (zero specificity, so any explicit radius still wins) */
:root{--round:10px}
:where(button,input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),select,textarea,img,video,canvas,iframe,dialog,details,summary,pre,kbd,progress,meter,fieldset,blockquote,aside,article,nav,header,footer,.card,.panel,.modal){border-radius:var(--round,10px)}
:where(.bar){border-radius:var(--round,10px)}
:where(.tools button[aria-pressed="true"].mode){border-radius:var(--round,10px)}
:where(.board){border-radius:var(--round,10px)}
</style>
<link rel="stylesheet" href="../mobile.css"><link rel="stylesheet" href="../cursor.css"><script src="../cursor.js"></script></head>
<body>
  <div class="app">
    <header class="bar">
      <div class="stat" aria-label="Flags left">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="3" width="2.4" height="18" rx="1" fill="#5b3a1a"/>
          <path d="M7 4l12 5.5L7 15z" fill="#e7471d"/>
        </svg>
        <span id="flags" aria-live="polite">0</span>
      </div>
      <div class="stat" aria-label="Time in seconds">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="13" r="8" fill="#fff"/>
          <path d="M12 8v5l3 2" stroke="#4a752c" stroke-width="2" fill="none" stroke-linecap="round"/>
          <rect x="10" y="2" width="4" height="2.4" rx="1" fill="#fff"/>
        </svg>
        <span id="time">0</span>
      </div>
      <div class="tools">
        <select id="diff" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="modeBtn" class="mode" type="button" aria-pressed="false" aria-label="Flag mode" title="Flag mode (F)">&#9873;</button>
        <button id="sfxBtn" type="button" aria-pressed="true" aria-label="Sound effects" title="Sound effects">FX</button>
        <a class="back" href="index.html">&lsaquo; Back</a>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="board" id="board">
        <canvas id="cv" role="img" aria-label="Minesweeper board. Click or press Enter to dig, right-click or press F to plant a flag."></canvas>
        <div class="overlay" id="overlay">
          <h2 id="ovTitle">Minesweeper</h2>
          <p id="ovText">Clear the board without hitting a mine. Click to dig. Right-click or hold to plant a flag.</p>
          <button class="play" id="playBtn" type="button">Play</button>
        </div>
      </div>
    </main>
  </div>

  <script src="recorder.js" data-game="minesweeper" data-canvas="#cv" data-grace="3000"></script>
  <script src="pause.js"></script>
  <script src="leaderboard.js"></script>
  <script>
    (() => {
      'use strict';
      const DIFFS = {
        easy:   { c: 10, r: 8,  m: 10, base: 1000 },
        medium: { c: 18, r: 14, m: 40, base: 2000 },
        hard:   { c: 24, r: 20, m: 99, base: 3000 }
      };
      const BEST_KEY = 'minesweeper-best';     // its own key, so other games' records are untouched
      const DIFF_KEY = 'minesweeper-diff';
      const NUM_COLORS = ['', '#1976d2', '#388e3c', '#d32f2f', '#7b1fa2', '#ff8f00', '#0097a7', '#424242', '#9e9e9e'];

      const $ = id => document.getElementById(id);
      const cv = $('cv'), ctx = cv.getContext('2d');
      const stage = $('stage'), board = $('board');
      const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'), playBtn = $('playBtn');
      const flagsEl = $('flags'), timeEl = $('time'), diffEl = $('diff'), modeBtn = $('modeBtn'), sfxBtn = $('sfxBtn');

      let diffKey = 'easy';
      try { const d = localStorage.getItem(DIFF_KEY); if (DIFFS[d]) diffKey = d; } catch (e) { /* storage unavailable */ }
      diffEl.value = diffKey;
      let best = 0;
      try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { best = 0; }

      let C, R, M, base;
      let mine, adj, open, flag;
      let state = 'ready';                    // ready | play | won | lost
      let opened = 0, flagCount = 0;
      let t0 = 0, secs = 0, timer = null;
      let cell = 28, hover = -1, cur = -1, boom = -1;
      let flagMode = false, overlayT = null;

      /* ---------- sound: tiny effects synthesised with Web Audio (no audio files) ---------- */
      const Snd = (() => {
        let ac = null, bus = null, on = true;
        try { on = localStorage.getItem('minesweeper-sfx') !== 'off'; } catch (e) { /* storage unavailable */ }
        const hz = m => 440 * Math.pow(2, (m - 69) / 12);
        function tone(type, f, d, vol, to, when) {
          if (!ac || !on) return;
          const t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
          o.type = type;
          o.frequency.setValueAtTime(f, t);
          if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(vol, t + 0.006);
          g.gain.linearRampToValueAtTime(0.0001, t + d);
          o.connect(g); g.connect(bus);
          o.start(t); o.stop(t + d + 0.02);
        }
        return {
          init() {
            if (!ac) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              ac = new AC();
              const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
              bus = ac.createGain(); bus.gain.value = 0.9; bus.connect(comp);
            } else if (ac.state === 'suspended') ac.resume();
          },
          get on() { return on; },
          set(v) { on = v; try { localStorage.setItem('minesweeper-sfx', v ? 'on' : 'off'); } catch (e) { /* ignore */ } },
          dig(n) { tone('square', hz(72 + (n % 5) * 2), 0.06, 0.08); },
          flag() { tone('triangle', hz(79), 0.07, 0.14); tone('triangle', hz(84), 0.08, 0.1, 0, 0.05); },
          unflag() { tone('triangle', hz(77), 0.07, 0.12); },
          boom() { tone('sawtooth', 180, 0.5, 0.3, 40); tone('square', 90, 0.45, 0.2, 30); },
          win() { [72, 76, 79, 84, 88, 91, 96].forEach((m, i) => tone('square', hz(m), 0.12, 0.13, 0, i * 0.09)); }
        };
      })();

      /* ---------- sizing: the board always fits the window ---------- */
      function layout() {
        const aw = stage.clientWidth - 24, ah = stage.clientHeight - 24;
        cell = Math.max(12, Math.floor(Math.min(aw / C, ah / R)));
        const dpr = window.devicePixelRatio || 1;
        const w = cell * C, h = cell * R;
        board.style.width = w + 'px';
        board.style.height = h + 'px';
        cv.style.width = w + 'px';
        cv.style.height = h + 'px';
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }
      window.addEventListener('resize', layout);

      /* ---------- game ---------- */
      const nbrs = i => {
        const x = i % C, y = (i - x) / C, out = [];
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && ny >= 0 && nx < C && ny < R) out.push(ny * C + nx);
        }
        return out;
      };

      function stopTimer() { clearInterval(timer); timer = null; }

      /* ---------- saved game: so a player can carry on later, or on another device ---------- */
      const SAVE_KEY = 'minesweeper-save';
      let resumePending = false;     // a saved game is loaded and waiting behind the "Resume" button
      const pack = a => Array.prototype.join.call(a, '');
      function saveGame() {
        if (state !== 'play') return;
        try { localStorage.setItem(SAVE_KEY, JSON.stringify({ t: Date.now(), diff: diffKey, mine: pack(mine), open: pack(open), flag: pack(flag), secs })); } catch (e) { /* storage unavailable */ }
      }
      function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }
      function startClock() {
        t0 = performance.now() - secs * 1000;
        timer = setInterval(() => setTime(Math.floor((performance.now() - t0) / 1000)), 250);
      }
      // load the saved game (the clock starts when the player presses Resume); false if there is none
      function resumeGame() {
        let sv = null;
        try { sv = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { sv = null; }
        const d = sv && DIFFS[sv.diff];
        const n = d ? d.c * d.r : 0;
        const okBits = v => typeof v === 'string' && v.length === n && /^[01]+$/.test(v);
        if (!d || !okBits(sv.mine) || !okBits(sv.open) || !okBits(sv.flag) || !Number.isInteger(sv.secs) || sv.secs < 0 || sv.secs > 999) { if (sv) clearSave(); return false; }
        const unpack = v => Uint8Array.from(v, ch => +ch);
        diffKey = sv.diff; diffEl.value = diffKey;
        C = d.c; R = d.r; M = d.m; base = d.base;
        mine = unpack(sv.mine); open = unpack(sv.open); flag = unpack(sv.flag);
        if (mine.reduce((a, b) => a + b, 0) !== M) { clearSave(); return false; }
        adj = new Uint8Array(n);
        for (let i = 0; i < n; i++) adj[i] = nbrs(i).reduce((a, j) => a + mine[j], 0);
        opened = open.reduce((a, b) => a + b, 0);
        flagCount = flag.reduce((a, b) => a + b, 0);
        boom = -1; hover = -1; cur = -1;
        state = 'play';
        stopTimer(); clearTimeout(overlayT);
        setTime(sv.secs); setFlags();
        resumePending = true;
        layout();
        return true;
      }
      function setTime(s) { secs = Math.min(999, s); timeEl.textContent = secs; }
      function setFlags() { flagsEl.textContent = M - flagCount; }

      function newGame() {
        clearSave();
        resumePending = false;
        const d = DIFFS[diffKey];
        C = d.c; R = d.r; M = d.m; base = d.base;
        const n = C * R;
        mine = new Uint8Array(n); adj = new Uint8Array(n); open = new Uint8Array(n); flag = new Uint8Array(n);
        opened = 0; flagCount = 0; boom = -1; hover = -1; cur = -1;
        state = 'ready';
        stopTimer(); clearTimeout(overlayT);
        setTime(0); setFlags();
        overlay.classList.add('hidden');
        layout();
      }

      function placeMines(first) {
        const safe = new Set([first, ...nbrs(first)]);
        const spots = [];
        for (let i = 0; i < C * R; i++) if (!safe.has(i)) spots.push(i);
        for (let k = 0; k < M; k++) {                       // pick M random spots
          const j = k + Math.floor(Math.random() * (spots.length - k));
          [spots[k], spots[j]] = [spots[j], spots[k]];
          mine[spots[k]] = 1;
        }
        for (let i = 0; i < C * R; i++) adj[i] = nbrs(i).reduce((a, j) => a + mine[j], 0);
      }

      function showOverlay(title, text, label, delay) {
        clearTimeout(overlayT);
        overlayT = setTimeout(() => {
          ovTitle.textContent = title;
          ovText.textContent = text;
          playBtn.textContent = label;
          overlay.classList.remove('hidden');
          playBtn.focus({ preventScroll: true });
        }, delay);
      }

      function lose(i) {
        clearSave();
        state = 'lost'; boom = i;
        stopTimer();
        Snd.boom();
        showOverlay('Game over', 'You hit a mine. Time: ' + secs + 's', 'Play again', 1000);
        draw();
      }

      function win() {
        clearSave();
        state = 'won';
        stopTimer();
        for (let i = 0; i < C * R; i++) if (mine[i] && !flag[i]) { flag[i] = 1; flagCount++; }
        setFlags();
        const score = Math.max(1, base - secs);
        const isBest = score > best;
        if (isBest) { best = score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* storage unavailable */ } }
        if (window.Leaderboard) Leaderboard.submit('minesweeper', score);
        Snd.win();
        showOverlay('You win!', 'Time: ' + secs + 's. Score: ' + score + (isBest ? ' (new best!)' : '. Best: ' + best), 'Play again', 700);
        draw();
      }

      function reveal(i) {
        if (state === 'won' || state === 'lost' || open[i] || flag[i]) return;
        if (state === 'ready') {
          placeMines(i);
          state = 'play';
          startClock();
        }
        if (mine[i]) { lose(i); return; }
        const stack = [i];
        let n = 0;
        while (stack.length) {
          const k = stack.pop();
          if (open[k] || flag[k] || mine[k]) continue;
          open[k] = 1; opened++; n++;
          if (!adj[k]) nbrs(k).forEach(j => { if (!open[j] && !flag[j]) stack.push(j); });
        }
        if (n) Snd.dig(n);
        if (opened === C * R - M) win(); else { saveGame(); draw(); }
      }

      function chord(i) {
        if (!open[i] || !adj[i]) return;
        const around = nbrs(i);
        if (around.reduce((a, j) => a + flag[j], 0) !== adj[i]) return;
        for (const j of around) { if (state === 'lost' || state === 'won') break; if (!open[j] && !flag[j]) reveal(j); }
      }

      function toggleFlag(i) {
        if (state === 'won' || state === 'lost' || open[i]) return;
        flag[i] = flag[i] ? 0 : 1;
        flagCount += flag[i] ? 1 : -1;
        flag[i] ? Snd.flag() : Snd.unflag();
        setFlags(); saveGame(); draw();
      }

      const act = i => { if (open[i] && adj[i]) chord(i); else reveal(i); };

      /* ---------- drawing ---------- */
      function drawFlag(x, y, s) {
        ctx.fillStyle = '#5b3a1a';
        ctx.fillRect(x + s * 0.3, y + s * 0.18, s * 0.07, s * 0.64);
        ctx.fillStyle = '#e7471d';
        ctx.beginPath();
        ctx.moveTo(x + s * 0.36, y + s * 0.18);
        ctx.lineTo(x + s * 0.76, y + s * 0.38);
        ctx.lineTo(x + s * 0.36, y + s * 0.58);
        ctx.closePath(); ctx.fill();
      }
      function drawMine(x, y, s) {
        const cx = x + s / 2, cy = y + s / 2, r = s * 0.22;
        ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = Math.max(1.5, s * 0.07);
        ctx.beginPath();
        for (let a = 0; a < 4; a++) {
          const ang = a * Math.PI / 4;
          ctx.moveTo(cx - Math.cos(ang) * r * 1.6, cy - Math.sin(ang) * r * 1.6);
          ctx.lineTo(cx + Math.cos(ang) * r * 1.6, cy + Math.sin(ang) * r * 1.6);
        }
        ctx.stroke();
        ctx.fillStyle = '#2b2b2b';
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.28, 0, Math.PI * 2); ctx.fill();
      }

      function draw() {
        if (!ctx || !mine) return;
        const over = state === 'lost' || state === 'won';
        ctx.clearRect(0, 0, C * cell, R * cell);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '700 ' + Math.round(cell * 0.62) + 'px system-ui, sans-serif';
        for (let i = 0; i < C * R; i++) {
          const x0 = i % C, y0 = (i - x0) / C, x = x0 * cell, y = y0 * cell, alt = (x0 + y0) & 1;
          const showMine = state === 'lost' && mine[i] && !flag[i];
          if (open[i]) {
            ctx.fillStyle = alt ? '#d7b899' : '#e5c29f';
          } else if (showMine && i === boom) {
            ctx.fillStyle = '#e7471d';
          } else if (i === hover && !over) {
            ctx.fillStyle = '#bfe17d';
          } else {
            ctx.fillStyle = alt ? '#a2d149' : '#aad751';
          }
          ctx.fillRect(x, y, cell, cell);
          if (open[i] && adj[i]) {
            ctx.fillStyle = NUM_COLORS[adj[i]];
            ctx.fillText(adj[i], x + cell / 2, y + cell / 2 + cell * 0.04);
          } else if (flag[i]) {
            drawFlag(x, y, cell);
            if (state === 'lost' && !mine[i]) {          // a flag that was in the wrong place
              ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = Math.max(2, cell * 0.09);
              ctx.beginPath();
              ctx.moveTo(x + cell * 0.2, y + cell * 0.2); ctx.lineTo(x + cell * 0.8, y + cell * 0.8);
              ctx.moveTo(x + cell * 0.8, y + cell * 0.2); ctx.lineTo(x + cell * 0.2, y + cell * 0.8);
              ctx.stroke();
            }
          } else if (showMine) {
            drawMine(x, y, cell);
          }
        }
        if (cur >= 0 && !over) {                           // keyboard cursor
          const x = (cur % C) * cell, y = Math.floor(cur / C) * cell;
          ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3;
          ctx.strokeRect(x + 1.5, y + 1.5, cell - 3, cell - 3);
        }
      }

      /* ---------- input: click / tap to dig, right-click or hold to flag ---------- */
      const cellAt = e => {
        const r = cv.getBoundingClientRect();
        const x = Math.floor((e.clientX - r.left) / cell), y = Math.floor((e.clientY - r.top) / cell);
        return x < 0 || y < 0 || x >= C || y >= R ? -1 : y * C + x;
      };
      let down = null, pressT = null, lastType = 'mouse';

      cv.addEventListener('pointerdown', e => {
        Snd.init();
        lastType = e.pointerType;
        if (e.button !== 0) return;
        const i = cellAt(e);
        if (i < 0) return;
        down = { i, x: e.clientX, y: e.clientY, long: false };
        if (e.pointerType !== 'mouse') {
          pressT = setTimeout(() => {
            if (!down) return;
            down.long = true;
            if (navigator.vibrate) navigator.vibrate(25);
            toggleFlag(down.i);
          }, 420);
        }
      });
      cv.addEventListener('pointermove', e => {
        if (e.pointerType === 'mouse') {
          const i = cellAt(e);
          if (i !== hover) { hover = i; draw(); }
        }
        if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) { clearTimeout(pressT); down = null; }
      });
      cv.addEventListener('pointerleave', () => { if (hover !== -1) { hover = -1; draw(); } });
      cv.addEventListener('pointerup', e => {
        clearTimeout(pressT);
        const d = down; down = null;
        if (!d || d.long || e.button !== 0) return;
        if (flagMode) toggleFlag(d.i); else act(d.i);
      });
      cv.addEventListener('pointercancel', () => { clearTimeout(pressT); down = null; });
      cv.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (lastType !== 'mouse') return;                  // touch long-press is handled above
        const i = cellAt(e);
        if (i >= 0) toggleFlag(i);
      });

      /* ---------- keyboard: arrows move, Enter / Space dig, F flags, R restarts ---------- */
      let clockWasOn = false;
      GamePause.init({
        playing: () => state === 'play' && !resumePending,
        onPause: () => { clockWasOn = !!timer; stopTimer(); saveGame(); },
        onResume: () => { if (clockWasOn && state === 'play') startClock(); clockWasOn = false; }
      });
      document.addEventListener('keydown', e => {
        if (e.target === diffEl || e.ctrlKey || e.metaKey || e.altKey) return;
        Snd.init();
        const k = e.key;
        if (!overlay.classList.contains('hidden')) return;
        if (k === 'r' || k === 'R') { newGame(); return; }
        const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
        if (arrows[k]) {
          e.preventDefault();
          if (cur < 0) cur = Math.floor(R / 2) * C + Math.floor(C / 2);
          else {
            const x = Math.max(0, Math.min(C - 1, (cur % C) + arrows[k][0]));
            const y = Math.max(0, Math.min(R - 1, Math.floor(cur / C) + arrows[k][1]));
            cur = y * C + x;
          }
          draw();
        } else if ((k === 'Enter' || k === ' ') && cur >= 0) {
          e.preventDefault(); act(cur);
        } else if ((k === 'f' || k === 'F') && cur >= 0) {
          e.preventDefault(); toggleFlag(cur);
        }
      });

      /* ---------- buttons ---------- */
      playBtn.addEventListener('click', () => {
        Snd.init();
        if (resumePending) {            // carry on with the saved game
          resumePending = false;
          overlay.classList.add('hidden');
          startClock();
          draw();
          return;
        }
        newGame();
      });
      diffEl.addEventListener('change', () => {
        diffKey = diffEl.value;
        try { localStorage.setItem(DIFF_KEY, diffKey); } catch (e) { /* storage unavailable */ }
        newGame();
        diffEl.blur();
      });
      modeBtn.addEventListener('click', () => {
        flagMode = !flagMode;
        modeBtn.setAttribute('aria-pressed', String(flagMode));
      });
      function paintSfx() { sfxBtn.setAttribute('aria-pressed', String(Snd.on)); }
      sfxBtn.addEventListener('click', () => { Snd.init(); Snd.set(!Snd.on); paintSfx(); });
      paintSfx();

      /* ---------- start: the title screen first, then the board ---------- */
      if (resumeGame()) {
        ovTitle.textContent = 'Welcome back';
        ovText.textContent = 'Your game is saved. Time: ' + secs + 's';
        playBtn.textContent = 'Resume';
      } else {
        newGame();
      }
      overlay.classList.remove('hidden');
    })();
  </script>
</body>
</html>
