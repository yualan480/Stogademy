  const D=[['maintenance','b','Maintenance mode (blocks the site)',1],['maintenance_msg','t','Maintenance message',1],['registration_enabled','b','Allow new players',1],['chat_enabled','b','Global chat',0],['chat_voice_enabled','b','Voice chat',0],['chat_dms_enabled','b','Direct messages (not private: admins can read them)',0],['chat_slow_seconds','n','Chat slow mode, seconds (0 = off)',0],['chat_max_len','n','Max chat message length',0],['suggestions_enabled','b','Suggestion box',1]];
  return `<form data-f="set">`+D.map(([k,t,l,o])=>{const v=r[k],dis=o&&!own?'disabled':'';return `<div class="card row"><label style="flex:1">${l}${o&&!own?' <span class="m">(owner only)</span>':''}</label>`+
  (t==='b'?`<input type="checkbox" name="${k}" data-t="b" ${v===true?'checked':''} ${dis}>`:`<input name="${k}" data-t="${t}" value="${esc(v)}" ${dis}>`)+`</div>`}).join('')+`<button class="pri">Save settings</button></form>`},
 async log(){const r=await api('admin_log?order=id.desc&limit=200'),c={};
  r.forEach(l=>{if(l.target==='player_status'&&l.detail&&l.detail.state!=='ok'){const n=l.detail.display||l.detail.name;c[n]=(c[n]||0)+1}});const rep=Object.entries(c).filter(x=>x[1]>=2);
  return `<h3>Repeat offenders</h3><p>${rep.map(x=>`<b>${esc(x[0])}</b> (${x[1]} actions)`).join(', ')||'<span class="m">None yet.</span>'}</p><h3>Admin action log</h3>`+
  tbl(['When','Staff','Action','On','Details'],r.map(l=>`<tr><td>${when(l.at)}</td><td>${esc(l.actor)}</td><td>${esc(l.action)}</td><td>${esc(l.target)}</td><td class="m">${esc(JSON.stringify(l.detail||'').slice(0,140))}</td></tr>`))},
 async staff(){const r=await api('staff?order=created_at');
  return tbl(['Email','Role','Chat badge name',''],r.map(s=>`<tr><td>${esc(s.email)}</td><td>${s.role}</td><td>${esc(s.chat_name||'')}</td><td>${s.email.toLowerCase()===EMAIL.toLowerCase()?'':btn('sdel',s.email,'Remove','dng')}</td></tr>`))+
  `<form class="card row" data-f="staff"><b>Add staff</b><input name="email" type="email" placeholder="Google email" required><select name="role"><option>moderator</option><option>admin</option><option>owner</option></select><input name="chat_name" maxlength="12" placeholder="Chat name for badge (optional)"><button class="pri">Add / update</button></form>
  <div class="card m">A chat badge name shows an OWNER / ADMIN / MOD tag in chat and reserves that name: only that person, signed in with Google on the site, can chat under it. Owner: everything. Admin: users, games, chat, MVP, feedback, reports. Moderator: chat, mutes, reports. User: normal site.</div>`}
};

/* ---- actions ---- */
const ask=t=>prompt(t)||'';
const A={
 psave:async g=>{if(!OWN)throw new Error('Only the owner can change payouts.');const r=document.querySelector(`[data-p="${g}"]`),v=parseFloat(r.querySelector('[name=pct]').value);
  if(!(v>=0.1&&v<=10000))throw new Error('Enter a percent from 0.1 to 10000.');const pm=Math.round(v*10);
  if(!sure('Set '+GN[g]+' to pay '+v+'% of the final score?'))return;await orbitRpc('set_game_rate',{p_game:g,p_permille:pm})},
 view:async n=>{const[m,s]=await Promise.all([api('chat_messages?select=message,created_at&order=id.desc&limit=15&name=ilike.'+q(n)),api('scores?select=game,score,created_at&order=created_at.desc&limit=15&name=ilike.'+q(n))]);
  const d=$('#dlg');d.innerHTML=`<h3>${esc(n)}</h3><b>Recent chat</b>${tbl(['When','Message'],m.map(x=>`<tr><td>${when(x.created_at)}</td><td>${esc(x.message)}</td></tr>`))}<b>Recent scores</b>${tbl(['Game','Score','When'],s.map(x=>`<tr><td>${x.game}</td><td>${x.score}</td><td>${when(x.created_at)}</td></tr>`))}<p><button onclick="dlg.close()">Close</button></p>`;d.showModal()},
 mute:n=>setP(n,{state:'muted',until:new Date(Date.now()+36e5).toISOString(),reason:ask('Reason?')}),
 mutef:n=>setP(n,{state:'muted',until:null,reason:ask('Reason?')}),
 unmute:n=>setP(n,{state:'ok',until:null}),unban:n=>setP(n,{state:'ok',until:null}),
 cban:async n=>{const c=(await api('player_status?name=eq.'+q(n.toLowerCase()))||[])[0];return setP(n,{chat_banned:!(c&&c.chat_banned)})},
 ban:n=>sure('Ban '+n+'? They can no longer post scores or chat.')&&setP(n,{state:'banned',until:null,reason:ask('Reason?')}),
 unsusp:n=>sure('Cancel '+n+"'s suspension?")&&setP(n,{state:'ok',until:null}),
 susp:n=>{const d=+ask('Suspend for how many days?');return d>0&&setP(n,{state:'suspended',until:new Date(Date.now()+d*864e5).toISOString()})},
 name:async n=>{const nn=prompt('Enter a new username for '+n+' (1–12 characters):',n);if(nn===null)return;if(!nn.trim())throw new Error('Username cannot be empty');if(nn.trim().length>12)throw new Error('Username must be 12 characters or fewer');if(!sure('Rename '+n+' to '+nn.trim()+' everywhere?'))return;return rpc('admin_rename_player',{old_name:n,new_name:nn.trim()})},
 rmplayer:n=>sure('Remove player "'+n+'" completely? This deletes all of their scores, chat messages, MVP adjustments and ban/mute record from the site. It cannot be undone.','REMOVE')&&rpc('admin_remove_player',{player_name:n}),
 avatar:n=>sure('Reset '+n+"'s avatar to the default?")&&Promise.all(['scores','chat_messages'].map(t=>api(t+'?name=ilike.'+q(n),{m:'PATCH',pref:'return=minimal',b:{avatar:'gamer'}}))),
 refresh:()=>0,clear:()=>sure('Delete ALL chat messages?','CLEAR')&&rpc('admin_clear_chat'),
 chdel:id=>sure('Remove the #'+id+' channel? Its messages stay in the database but nobody can open them.')&&api('chat_channels?id=eq.'+encodeURIComponent(id),{m:'DELETE',pref:'return=minimal'}),
 delmsg:id=>sure('Delete this message?')&&api('chat_messages?id=eq.'+id,{m:'DELETE',pref:'return=minimal'}),
 pin:d=>{const[i,v]=d.split('|');return api('chat_messages?id=eq.'+i,{m:'PATCH',pref:'return=minimal',b:{pinned:v==='true'}})},
 gsave:id=>{const r=document.querySelector(`[data-g="${id}"]`),b={};r.querySelectorAll('input').forEach(i=>b[i.name]=i.type==='checkbox'?i.checked:i.type==='number'?+i.value:(i.value||null));return api('games_config?id=eq.'+id,{m:'PATCH',pref:'return=minimal',b})},
 gdel:id=>sure('Remove '+id+' from the site list?')&&api('games_config?id=eq.'+id,{m:'DELETE',pref:'return=minimal'}),
 rs:g=>sure('Delete every score for '+g+'?','RESET')&&rpc('admin_reset_scores',{g}),rall:()=>sure('Delete EVERY score in EVERY game?','RESET ALL')&&rpc('admin_reset_scores',{g:null}),
 delsc:id=>sure('Remove this score?')&&api('scores?id=eq.'+id,{m:'DELETE',pref:'return=minimal'}),
 fsave:id=>{const r=document.querySelector(`[data-g="${id}"]`),g=n=>r.querySelector(`[name=${n}]`).value;return api('suggestions?id=eq.'+id,{m:'PATCH',pref:'return=minimal',b:{kind:g('kind'),status:g('status'),note:g('note')||null}})},
 fpost:async id=>{const s=(await api('suggestions?id=eq.'+id))[0];return api('announcements',{m:'POST',pref:'return=minimal',b:{title:'Update: '+s.message.slice(0,60),body:s.note||'Status: '+s.status,kind:'info'}})},
 fdel:id=>sure('Delete this submission?')&&api('suggestions?id=eq.'+id,{m:'DELETE',pref:'return=minimal'}),
 atog:d=>{const[i,v]=d.split('|');return api('announcements?id=eq.'+i,{m:'PATCH',pref:'return=minimal',b:{active:v==='true'}})},
 adel:id=>sure('Delete announcement?')&&api('announcements?id=eq.'+id,{m:'DELETE',pref:'return=minimal'}),
 sdel:e=>sure('Remove staff '+e+'?')&&api('staff?email=eq.'+encodeURIComponent(e),{m:'DELETE',pref:'return=minimal'})
};
const F={
 uq:f=>{cache.uq=f.q.value},
 gadd:f=>api('games_config',{m:'POST',pref:'return=minimal',b:{id:f.id.value.trim().toLowerCase(),title:f.title.value,page:f.page.value,sort_order:99}}),
 chadd:f=>api('chat_channels',{m:'POST',pref:'return=minimal',b:{id:f.id.value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-'),title:f.title.value.trim(),score_only:f.score_only.checked,staff_only:f.staff_only.checked,sort_order:50}}),
 mvp:f=>sure('Adjust '+f.name.value+' by '+f.delta.value+' MVP points?')&&api('mvp_adjustments',{m:'POST',pref:'return=minimal',b:{name:f.name.value.trim(),delta:+f.delta.value,reason:f.reason.value||null}}),
 ann:f=>api('announcements',{m:'POST',pref:'return=minimal',b:{title:f.title.value,body:f.body.value||null,kind:f.kind.value,pinned:f.pinned.checked,starts_at:f.starts_at.value?new Date(f.starts_at.value).toISOString():null,ends_at:f.ends_at.value?new Date(f.ends_at.value).toISOString():null}}),
 set:async f=>{for(const i of f.querySelectorAll('input:not([disabled])')){const v=i.dataset.t==='b'?i.checked:i.dataset.t==='n'?+i.value:i.value;await upsert('site_settings','key',{key:i.name,value:v,updated_at:new Date().toISOString()})}},
 staff:f=>sure('Give '+f.email.value+' the '+f.role.value+' role?')&&upsert('staff','email',{email:f.email.value.trim().toLowerCase(),role:f.role.value,chat_name:f.chat_name.value.trim()||null})
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])run(()=>A[b.dataset.a](b.dataset.d),'Done')});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(f){e.preventDefault();run(()=>F[f.dataset.f](f),f.dataset.f==='uq'?'':'Saved')}});
document.addEventListener('change',e=>{if(e.target.dataset.s){cache[e.target.dataset.s]=e.target.value;show(tab)}});
orbitOwner().then(m=>{if(m){ls(SK,null);$('#gate').innerHTML='<h2>Admin only</h2><p class="bad">'+esc(m)+'</p>';return}boot()});
</script></body></html>
